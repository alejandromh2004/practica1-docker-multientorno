version: '3.8'

services:
  # Servicio 1: Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volumen con nombre para asegurar que los datos persisten
      - dev_db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    # Comprobación de salud nativa de PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio 2: Aplicación Flask
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
    ports:
      # Solo exponemos la web al exterior
      - "${WEB_PORT}:5000"
    networks:
      - internal_network
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck para comprobar que la app responde en /status
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status')"]
      interval: 10s
      timeout: 5s
      retries: 3

# Red interna privada
networks:
  internal_network:
    driver: bridge

# Volumen gestionado por Docker
volumes:
  dev_db_data: